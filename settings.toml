# Settings for comparing collection cycles. Change these instead of the code.

[comparison]
# How Vote411 records are compared between two cycles.
#   "auto"      Question by question when the baseline cycle's manifest says the state's Vote411
#               records came from question headings and the current cycle has question-heading
#               records too (method question_headings or mixed); by section otherwise (for example
#               when the baseline turned each section title into one question, as most 2024 states
#               did, or holds page fragments, as Illinois does in 2024).
#   "section"   Always by section.
#   "question"  Always question by question.
# A state listed under [comparison.vote411_unit_overrides] further down uses the unit given there,
# whatever this setting and the manifests say.
vote411_unit = "auto"

# Two questions that are not identical count as one question reworded when their similarity
# (0 to 1, after lowercasing and removing punctuation) is at least this. Pairs from the 2024 and
# 2026 data at 0.8 to 0.9 were rewordings; pairs at 0.7 to 0.8 were often different questions.
reworded_threshold = 0.8

# A changed answer or section with similarity at or above this is a minor edit, below it a major
# one. In the 2024 to 2026 Vote411 sections, pairs at 0.85 and above were date updates, added
# link labels or one added sentence; pairs at 0.80 to 0.85 already included changed deadlines and
# a rewritten voter ID section.
answer_minor_threshold = 0.85

# A line repeated in at least this share of one source's answers in a state, for one cycle, is
# page boilerplate (such as a contact line under every answer) and is ignored when comparing.
# It applies only when the state has at least boilerplate_min_answers answers for that source.
boilerplate_share = 0.6
boilerplate_min_answers = 5

# Per-state choice of the Vote411 comparison unit: a lowercase state code set to "section" or
# "question". It takes priority over vote411_unit and over the methods in the manifests.
[comparison.vote411_unit_overrides]
# Illinois: the 2024 Vote411 records are dates and page fragments ("By Mail: Tuesday, October 8,
# 2024", "Get Registered"), not questions, so they can only be compared by section.
il = "section"

# Records dropped as page elements rather than FAQ questions, when building a cycle's dataset.
# Dropped records are listed in the cycle's data quality report.
[non_faq]
# The same question and answer on at least this many pages of one state, with a question of at
# most this many words, is a repeated page element such as Minnesota's "Need help?" contact box.
repeated_min_pages = 3
repeated_max_words = 4

# Each pattern is matched against the question in lowercase with punctuation and apostrophes removed.
# Most are anchored with ^ and $ to match the whole question, so "Can I have help voting?" is never
# caught by the help rule. Check a new rule against the baseline cycle too: a prompt the baseline
# kept as a question (such as North Carolina's "Unsure if you are registered?") should stay.
[[non_faq_rules]]
name = "offer of help"
pattern = '^(how can we help( you)?|need (more |any )?help|need assistance)$'

[[non_faq_rules]]
name = "invitation to ask more"
pattern = '^((do you )?(still )?have (more |other |additional )?questions|(more |other |additional )?questions( about .*)?)$'

[[non_faq_rules]]
name = "volunteer prompt"
pattern = '^ready to (serve|vote|help|volunteer)$'

[[non_faq_rules]]
name = "link label"
pattern = '^(learn|read|find out) more\b'

[[non_faq_rules]]
name = "promotional card"
pattern = '^going abroad$'

# Thresholds for the data quality report.
[quality]
short_answer_chars = 25
long_answer_chars = 6000
# A state's record count for a source below this share of the baseline cycle's count is reported.
below_baseline_ratio = 0.5

# Topics for the topic coverage numbers, topics.csv and the topic chart. A question counts for a
# topic when the topic's pattern is found in it. Only the question is checked, not the answer, in
# lowercase with punctuation and apostrophes removed ("I.D." becomes "i d", "I'd" becomes "id").
# One question can count for several topics.
#   name     Becomes the column names in per_state.csv (voter_id_baseline, voter_id_current) and
#            the topic value in topics.csv. Lowercase letters, digits and underscores.
#   label    The name shown on the chart.
#   pattern  A regular expression. Alternatives are separated by |, and \b marks a word edge.
#   ignore   Optional. Phrases cut out of the question before the pattern is tried, for wordings
#            that use a topic's keyword for something else. "Can a poll worker reject my ID?" is
#            not a polling place question, but "Can a poll worker help me at my polling place?"
#            still is, because "polling place" is left after "poll worker" is cut out.
# The order here is the column order in the output files and on the chart. After changing a
# rule, check it against both cycles' questions: a keyword that looks safe often is not ("due"
# also matches "due to a disability", and "ID" alone would match "I'd like to").

[[topics]]
name = "registration"
label = "Registration"
# Voter rolls are the registration lists. Ignored: registering a business with the Illinois
# board, a vehicle, a PAC or a minor party (up to five words may sit between "register" and the
# thing registered), and a phone number on the do not call list.
pattern = '\bregist|\bvoter rolls?\b'
ignore = '\bregist\w*( \w+){0,5} (business\w*|vehicle|pacs?|political action committees?|minor political party)\b|\bbusiness\w*( \w+){0,3} regist\w*|\bregistered with revenue\b|\bregistered on the do not call list\b'

[[topics]]
name = "mail_absentee"
label = "Mail and absentee"
# Covers the ways a ballot is described as mailed or returned: "mail my ballot", "mailed ballot",
# "when are ballots mailed", "ballot in the mail", "return my ballot", plus Kansas's "advance
# ballot" and Florida's "ballot intake station" (its name for a drop box). Ignored: registering
# to vote by mail, and sample ballots, which also arrive in the mail.
pattern = '\babsentee|\bmail in\b|\bby mail\b|\bvote by mail|\bmail (ballot|voting)|\bmail(ed)? (in )?(my |your |a |the |their )?((voted|completed|advance) )*ballot|\bballots? (\w+ ){0,2}mailed\b|\bballots? (arrive )?in (the )?mail\b|\badvance ballots?\b|\breturn(ing|ed)? (my |your |a |the |their )?((voted|completed|advance) )*ballot|\bdrop ?box|\bballot intake station'
ignore = '\bregist\w* (to vote )?by mail\b|\bsample ballots?\b'

[[topics]]
name = "early_voting"
label = "Early voting"
# Includes the other names states use for voting in person before election day: "early in-person
# voting" (Virginia), "in-person absentee" (Wisconsin, Indiana, Maine, Alaska) and "advance voting"
# (Kansas), and questions that ask about voting before election day.
pattern = '\bearly (in person )?vot|\bvot(e|ed|ing) early\b|\bballots? early\b|\bvote before election day\b|\bin person absentee\b|\bvot(e|ing) (by )?absentee (ballot )?in person\b|\babsentee voting in person\b|\badvance (in person )?vot|\badvance in person\b'

[[topics]]
name = "voter_id"
label = "Voter ID"
# Any mention of an ID, identification or proof of identity, for voting or for registering.
# Ignored: the "voter ID card" that Oklahoma and Missouri mail to registered voters (a
# registration card), and "I'd like", which becomes "id like" once the apostrophe is removed.
pattern = '\bids?\b|\bi d\b|\bidentification\b|\bproof of identity\b|\bprove (my|your) identity\b'
ignore = '\bvoter (id|identification) cards?\b|\bi ?d (like|rather|prefer|love)\b'

[[topics]]
name = "polling_places"
label = "Polling places"
# Where and when to vote in person: polling places and their hours, "the polls", vote centers,
# precincts, and "where do I vote" in its different wordings. Ignored: poll workers, poll
# watchers, poll books, exit polls, precinct committee offices and the precinct register.
pattern = '\bpolling (place|location|site|center|station|hours)|\bvoting (location|place|site|hours)|\bpolls?\b|\bwhere (to|(do |can |should |will )?(i|you|we)( can| should)?) (go )?(to )?vote\b|\bvote centers?\b|\bprecinct'
ignore = '\bpoll (workers?|watchers?|books?|list|tax)\b|\bexit polls?\b|\bprecinct (committee\w*|register|registry)\b'

[[topics]]
name = "deadlines"
label = "Deadlines"
# The word deadline, and questions that ask for one in other words: "last day", "when is it due",
# "too late", "when do I need to register", "when must my ballot be returned", "when does
# registration close", "arrive in time". Ignored: "due to", which gives a reason, not a date.
pattern = '\bdeadlines?\b|\blast day\b|\bdue\b|\b(how|too) late\b|\blatest (i|you|a voter) can\b|\blate regist|\bpostmark|\bby what date\b|\bby when\b|\bhow soon\b|\bcut ?off\b|\bwhen must\b|\bwhen (do|does|should) .{0,60}\b(need|needs|have|has) to\b|\bregistration (closes?|ends?)\b|\bclose of registration\b|\b(arrive|arrives|received|returned|registered|ballot) in time\b'
ignore = '\bdue to\b'

# Vote411 sections, with a keyword rule that assigns a record to a section when a cycle's records
# do not say which section they came from (the 2024 data). Each pattern is a regular expression
# matched against the record's question in lowercase with punctuation removed. Rules are tried in
# order and the first match wins, so put narrow rules (such as ID for registration) before broad
# ones (such as voter ID). Titles match the section headings on the 2026 Vote411 pages.

[[vote411_sections]]
title = "Ballot Notice and Cure Process"
pattern = '\bcure\b|fix (any )?issues?|issues? with (my|your)'

[[vote411_sections]]
title = "Campaign Finance Information"
pattern = 'campaign (finance|contributions?)|\bcontributions?\b'

[[vote411_sections]]
title = "Candidate and Ballot Measure Information"
pattern = '\bcandidates?\b|ballot measures?'

[[vote411_sections]]
title = "Poll Worker Information"
pattern = 'poll workers?'

[[vote411_sections]]
title = "Drop Boxes"
pattern = 'drop ?box'

[[vote411_sections]]
title = "Provisional Voting"
pattern = 'provisional'

[[vote411_sections]]
title = "Overseas and Military Voters"
pattern = 'military|overseas|uocava'

[[vote411_sections]]
title = "Provisions for Voters with Disabilities"
pattern = 'disabilit|accessib'

[[vote411_sections]]
title = "Time Off To Vote"
pattern = 'time off'

[[vote411_sections]]
title = "Voting Machines"
pattern = '\bmachines?\b'

[[vote411_sections]]
title = "Official Election Results"
pattern = '\bresults?\b'

[[vote411_sections]]
title = "Student Voting Process"
pattern = '\bstudents?\b|\bcollege\b'

[[vote411_sections]]
title = "Ranked Choice Voting"
pattern = 'ranked'

[[vote411_sections]]
title = "Registering after Moving"
pattern = '\bmov(e|ed|ing)\b'

[[vote411_sections]]
title = "Voter Registration Deadlines"
pattern = 'deadline.*regist|regist.*deadline'

[[vote411_sections]]
title = "ID Needed for Voter Registration"
pattern = '(\bids?\b|identification).*regist|regist.*(\bids?\b|identification|citizenship)'

[[vote411_sections]]
title = "Voter ID Requirements"
pattern = '\bids?\b|identification'

[[vote411_sections]]
title = "Verify Voter Registration"
pattern = 'verify|registration status|check my registration|am i registered'

[[vote411_sections]]
title = "Early Voting"
pattern = 'early (voting|vote)|vote early'

[[vote411_sections]]
title = "Primary Election Process"
pattern = '\bprimary\b|\bprimaries\b'

[[vote411_sections]]
title = "Absentee Ballot Process"
pattern = 'absentee|by mail|mail ?in\b|mail ballots?'

[[vote411_sections]]
title = "Vote by Mail"
pattern = 'vote by mail'

[[vote411_sections]]
title = "Election Day Voting Hours"
pattern = '\bhours?\b|polls? (open|close)'

[[vote411_sections]]
title = "Polling Place Locations"
pattern = 'polling (place|center|location)|vote centers?|where (do|can|should) i vote|locator|\blocation\b'

[[vote411_sections]]
title = "Eligibility Requirements"
pattern = 'eligib'

[[vote411_sections]]
title = "Election Dates"
pattern = 'election dates?|important dates|upcoming elections?|when (is|are) the (next )?elections?'
